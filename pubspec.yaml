name: university_companion_app
description: University Companion - Class Schedule & QPI Calculator MVP for Philippine university students.
publish_to: 'none'
version: 2.1.9

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.17
  flutter_timezone: ^5.1.0  
  file_picker: ^8.1.6
  syncfusion_flutter_pdf: ^27.2.5
  shared_preferences: ^2.5.5
  url_launcher: ^6.2.10
  package_info_plus: ^8.1.0

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_ai: ^3.15.0
  cloud_firestore: ^6.8.0
  google_sign_in: ^6.2.2

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  fl_chart: ^0.69.0
  flutter_local_notifications: ^22.2.0
  timezone: 0.11.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - lib/images/
